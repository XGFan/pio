when:
  branch: master
  event: [push, manual]
steps:
  - name: test
    image: golang:1.26-alpine
    commands:
      # git needed for Go's -buildvcs stamping; alpine base lacks it.
      - apk add --no-cache git
      - go vet ./...
      - go test -timeout 3m ./...
  - name: build
    image: docker.test4x.com/xgfan/plugin-docker-buildx-check
    settings:
      repo: docker.test4x.com/xgfan/pio
      registry: docker.test4x.com
      mirror: https://docker.test4x.com
      tags:
        - "${CI_COMMIT_SHA:0:8}"
        - latest
      mtu: 1450
      cache_from: docker.test4x.com/xgfan/pio:cache
      cache_to: docker.test4x.com/xgfan/pio:cache
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
  # 把 infra 仓库里该 app 的 image tag 改成本次构建的 sha8 并 push —— 部署由这一步决定。
  # 失败必须让流水线变红(它就是部署本身)。见 infra k8s/apps/woodpecker/plugins/flux-bump.sh。
  - name: flux-bump
    image: docker.test4x.com/xgfan/plugin-flux-bump
    settings:
      repo: docker.test4x.com/xgfan/pio
      tag: "${CI_COMMIT_SHA:0:8}"
      ssh_key:
        from_secret: infra_deploy_key
  # 叫 Flux 立刻拉 git(否则等 GitRepository 的 1m 轮询)。agent 是 k8s backend、
  # 跑在集群内,直连 ClusterIP 即可。见 infra k8s/apps/flux2bark/README.md。
  - name: trigger-flux
    image: alpine:3.20
    failure: ignore # webhook 挂了不该让流水线变红
    environment:
      FLUX_URL:
        from_secret: flux_webhook_url
    commands:
      - apk add --no-cache curl >/dev/null
      - curl -sf -X POST "$FLUX_URL" -d '{}' && echo "[flux] git pull triggered"
  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      server: https://notify.test4x.com
      token:
        from_secret: bark_token
      status: success
  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      server: https://notify.test4x.com
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
